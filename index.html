<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1d31" />
    <script>
      /* Resolve the theme before first paint: a stored explicit choice
         wins, otherwise follow the OS. Mirrors src/lib/theme.ts. */
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('rr-theme') || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>

    <title>RuralReact — Industrial automation configured for your process</title>
    <meta
      name="description"
      content="Tell RuralReact what you want to measure, control, automate or monitor. We convert your requirement into a configurable industrial automation solution: sensors, PLC, control panel, IIoT gateway and cloud."
    />
    <link rel="canonical" href="https://ruralreact.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="RuralReact — Industrial automation configured for your process" />
    <meta
      property="og:description"
      content="From sensor to cloud, engineered as one system. Configure your solution or talk to an engineer."
    />
    <meta property="og:image" content="/hero-plant.png" />
    <meta property="og:url" content="https://ruralreact.in/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
